<style>
:root {
  /* Fight-poster header, class cards on the home page, 14-bag board on each class page */
  --bg: #eceef2; --surface: #ffffff; --ink: #13161d; --muted: #5d6472; --line: #d8dce4;

  --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1015; --surface: #171a21; --ink: #eef0f4; --muted: #9aa1ae; --line: #2a2f3a;
    --accent: #ff5149; --on-accent: #1a0909; --ok: #3fcf8e; --warn: #f0a634; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 56px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; }
.brand { font-family: var(--display); font-size: 24px; letter-spacing: .03em; text-decoration: none; text-transform: uppercase; }
.brand span { color: var(--accent); }
.top small { color: var(--muted); font-weight: 600; }
p { margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; margin: 0; line-height: .95; text-wrap: balance; }
h1 { font-size: clamp(46px, 10vw, 92px); }
h2 { font-size: 26px; letter-spacing: .02em; display: flex; gap: 10px; align-items: baseline; }
h2 .n { color: var(--muted); font-size: 20px; font-variant-numeric: tabular-nums; }
h3 { margin: 6px 0 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.eyebrow { font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.hero { display: grid; gap: 10px; padding: 18px 0 26px; border-bottom: 3px solid var(--ink); margin-bottom: 24px; }
.hero h1 span { color: var(--accent); display: block; }
.hero .lede { max-width: 60ch; color: var(--muted); font-size: 18px; font-weight: 500; }
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.ccard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; text-decoration: none; transition: border-color .15s, transform .15s; }
.ccard:hover { border-color: var(--ink); transform: translateY(-2px); }
.ccard:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.ccard .row1 { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.ccard h2 { font-size: 30px; }
.ccard .when { font-weight: 600; }
.ccard .meta { color: var(--muted); font-size: 14px; font-weight: 500; }
.meter { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.ccard .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; font-weight: 600; }
.ccard .cta { color: var(--accent); font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; border: 2px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.last { color: var(--accent); } .pill.idle { color: var(--muted); }
.pill.full { color: var(--surface); background: var(--ink); border-color: var(--ink); }
.pill.full::before { background: var(--accent); }
.pill.warn::before, .pill.last::before { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.notice { margin-top: 20px; border-left: 4px solid var(--warn); background: var(--surface); padding: 12px 14px; border-radius: 6px; font-weight: 500; }
.notice[hidden] { display: none; }
.foot-note { margin-top: 28px; color: var(--muted); font-size: 14px; }

/* Class page */
.back { display: inline-flex; gap: 6px; font-weight: 700; text-decoration: none; color: var(--muted); padding: 4px 0; }
.back:hover { color: var(--ink); }

.countdown { font-weight: 600; font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 20px; }
.col { display: contents; }
.capacity { order: 1; } .book { order: 2; } .roster { order: 3; } .share { order: 4; } .bring { order: 5; }
@media (min-width: 880px) { .grid { grid-template-columns: 1.05fr 1fr; align-items: start; } .col { display: grid; gap: 20px; min-width: 0; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.cap-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.big { font-family: var(--display); font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; }
.big .of { color: var(--muted); font-size: 34px; margin-left: 4px; }
.big-label { display: block; font-family: var(--body); font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.sub { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.heat { color: var(--accent); font-weight: 600; }
.heat[hidden] { display: none; }
.bags { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 14px 8px; }
.bag { position: relative; aspect-ratio: 3 / 4.4; border-radius: 10px 10px 16px 16px; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--muted); }
.bag::before { content: ""; position: absolute; top: -10px; left: 50%; width: 2px; height: 8px; background: var(--line); }
.bag .ini { font-weight: 700; font-size: 15px; }
.bag .open { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.bag .num { position: absolute; bottom: 5px; font-size: 10px; font-weight: 700; opacity: .8; }
.bag.taken { background: var(--accent); border: 2px solid var(--accent); color: var(--on-accent); }
.bag.taken::before { background: var(--muted); }
.legend { color: var(--muted); font-size: 14px; }
form { display: grid; gap: 8px; }
label { font-weight: 600; }
.frow { display: flex; flex-wrap: wrap; gap: 10px; }
input[type="text"] { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); }
input[type="text"]:focus-visible { outline: none; border-color: var(--ink); }
button { font: inherit; cursor: pointer; border-radius: 10px; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--on-accent); border: 0; padding: 12px 20px; font-weight: 700; font-size: 17px; }
.secondary { justify-self: start; background: var(--ink); color: var(--surface); border: 0; padding: 11px 18px; font-weight: 700; }
.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); padding: 6px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.ghost:hover:not(:disabled) { border-color: var(--ink); }
button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-weight: 600; min-height: 1.45em; }
.msg.ok { color: var(--ok); } .msg.err { color: var(--accent); } .msg.info { color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--accent); color: var(--on-accent); }
.who { min-width: 0; display: grid; }
.who strong { font-weight: 600; overflow-wrap: anywhere; }
.who span { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.list.wait .av { background: transparent; color: var(--warn); border: 2px solid var(--warn); }
.list.out .av { background: var(--bg); color: var(--muted); }
.list.out strong { color: var(--muted); text-decoration: line-through; }
.empty { color: var(--muted); }
.group { display: grid; gap: 4px; }
.group[hidden] { display: none; }
.invite { margin: 0; padding: 14px; background: var(--bg); border-radius: 10px; white-space: pre-wrap; font-family: var(--body); font-size: 15px; user-select: all; -webkit-user-select: all; }
.bring ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
@media (max-width: 420px) { .wrap { padding: 0 16px 40px; } .card { padding: 16px; } .bags { gap: 12px 5px; } .bag .ini { font-size: 13px; } .bag .open { font-size: 9px; } .big { font-size: 54px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>

      blurb: "Kicks, knees and combos on the heavy bags.", bring: ["Hand wraps", "Gloves (loaners available)", "Water"] },
    { id: "sunrise-hiit", name: "Sunrise HIIT", coach: "Mike", days: [1, 2, 3, 4, 5], hour: 6, min: 0, len: 45, level: "All levels", room: "Turf",

    { id: "jiu-jitsu", name: "Jiu-Jitsu", coach: "Andre", days: [2, 4], hour: 19, min: 30, len: 75, level: "Fundamentals", room: "Mat room",

  ];

  var db = null;

  var app = document.getElementById("app");
  var S = { rows: [], loaded: false, error: "", busy: false, msg: "", msgKind: "" };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
  function initials(n) { return n.trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join("").toUpperCase(); }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function daysLabel(c) {

  }
  function nextSession(c, now) {

  }
  function dayWord(start, now) {
    var a = new Date(now); a.setHours(0, 0, 0, 0);

  }
  function countdown(start, now) {

    var m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);

  }
  function ago(t) {
    var m = Math.max(0, Math.round((Date.now() - new Date(t).getTime()) / 60000));
    if (m < 1) return "just now"; if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60); if (h < 24) return h + "h ago"; return Math.floor(h / 24) + "d ago";
  }
  function scarcity(n) {
    var left = Math.max(0, CAP - n);
    if (left === 0) return { label: "Full · waitlist open", kind: "full" };
    if (left === 1) return { label: "Last spot!", kind: "last" };
    if (left <= 4) return { label: "Only " + left + " spots left", kind: "warn" };

  }
  function rowsFor(c, date) {
    var all = S.rows.filter(function (r) { return r.class_id === c.id && r.session_date === date; });

      out: all.filter(function (r) { return r.status === "out"; }).sort(function (a, b) { return new Date(b.updated_at) - new Date(a.updated_at); })
    };
  }

  async function load() {

    if (res.error) {
      var code = res.error.code || "";

  function noticeHtml() {

  function renderHome() {

    var cards = CLASSES.map(function (c) {

        '<div class="meter" aria-hidden="true"><i style="width:' + (S.loaded ? Math.round(n / CAP * 100) : 0) + '%"></i></div>' +
        '<div class="foot"><span>' + (S.loaded && !S.error ? n + " of " + CAP + " spots taken" : "&nbsp;") + '</span><span class="cta">Book &rarr;</span></div></a>';
    }).join("");
    app.innerHTML =
      '<section class="hero"><p class="eyebrow">Kenvil, NJ · Class schedule</p><h1>Train with us<span>this week</span></h1>' +
      '<p class="lede">Pick a class, type your name and your spot is saved. Every class caps at 14, so book early.</p></section>' +
      '<section class="cards" aria-label="Classes">' + cards + "</section>" + noticeHtml() +
      '<p class="foot-note">Can\'t make it? Open your class and tap Opt out so someone on the waitlist gets your spot.</p>';
  }

  function renderClass(c) {
    var now = new Date(), start = nextSession(c, now), date = ymd(start), word = dayWord(start, now);
    var R = rowsFor(c, date), n = R.going.length, left = Math.max(0, CAP - n), sc = scarcity(n);
    var live = S.loaded && !S.error;
    var bags = "";
    for (var b = 1; b <= CAP; b++) {
      var d = R.going[b - 1];
      bags += d ? '<li class="bag taken" title="' + esc(d.name) + '"><span class="ini">' + esc(initials(d.name)) + '</span><span class="num">' + b + "</span></li>"

    var link = location.href.split("#")[0] + "#" + c.id;

    app.innerHTML =
      '<a class="back" href="#">&larr; All classes</a>' +
      '<section class="chero"><p class="eyebrow">' + esc(word) + " · " + esc(start.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })) + "</p>" +
      '<h1><span>' + esc(c.name) + '</span><span class="time">' + esc(timeLabel(c)) + "</span></h1>" +
      '<ul class="cmeta"><li><b>' + c.len + " min</b></li><li>Coach <b>" + esc(c.coach) + "</b></li><li>" + esc(c.room) + "</li><li><b>" + esc(c.level) + "</b></li><li>" + esc(daysLabel(c)) + "</li></ul>" +
      '<p class="countdown">' + countdown(start, now) + "</p></section>" +
      '<div class="grid"><div class="col">' +
        '<section class="card capacity" aria-label="Spots taken"><div class="cap-top"><div class="big"><span>' + (live ? n : "–") + '</span><span class="of">/14</span><span class="big-label">Spots taken</span></div>' +
          '<span class="pill ' + (live ? sc.kind : "idle") + '">' + esc(live ? sc.label : (S.loaded ? "Not open yet" : "Loading")) + "</span></div>" +
          '<p class="sub">' + (live ? parts.join(" · ") : "&nbsp;") + "</p>" +
          (live && recent >= 2 && left > 0 ? '<p class="heat">' + recent + " people booked in the last hour. Spots are going fast.</p>" : "") +
          '<ul class="bags" aria-label="14 spots">' + bags + '</ul><p class="legend">Each spot is a heavy bag station.</p></section>' +
        '<section class="card book"><h2>Save your spot</h2>' + noticeHtml() +
          '<form id="form" autocomplete="off"><label for="name">Your name</label><div class="frow"><input type="text" id="name" maxlength="40" placeholder="First and last name"' + dis + '>' +
          '<button type="submit" class="primary"' + dis + ">" + (live && left === 0 ? "Join the waitlist" : "Reserve my spot") + "</button></div></form>" +
          '<p class="msg ' + S.msgKind + '" role="status" aria-live="polite">' + esc(S.msg) + "</p></section>" +
        '<section class="card share"><h2>Share this class</h2><p>Send it to the group chat so everyone can see who\'s in.</p><pre class="invite" id="invite">' + esc(invite) + '</pre><button type="button" class="secondary" id="copy">Copy message</button></section>' +
      '</div><div class="col">' +
        '<section class="card roster"><h2>Who\'s coming <span class="n">' + (live ? n + "/" + CAP : "") + "</span></h2>" +
          '<ul class="list going">' + (n ? R.going.map(function (r, i) { return row(r, i, "in"); }).join("") : '<li class="empty">' + (live ? "Nobody yet. Be the first one in." : "Loading…") + "</li>") + "</ul>" +
          '<div class="group"' + (R.wait.length ? "" : " hidden") + '><h3>Waitlist (' + R.wait.length + ')</h3><ul class="list wait">' + R.wait.map(function (r, i) { return row(r, i, "wait"); }).join("") + "</ul></div>" +
          '<div class="group"' + (R.out.length ? "" : " hidden") + '><h3>Opted out (' + R.out.length + ')</h3><ul class="list out">' + R.out.map(function (r, i) { return row(r, i, "out"); }).join("") + "</ul></div></section>" +
        '<section class="card bring"><h2>What to bring</h2><ul>' + c.bring.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "<li>Arrive 10 minutes early</li></ul></section>" +
      "</div></div>";

    var form = document.getElementById("form");
    form.addEventListener("submit", function (e) { e.preventDefault(); book(c, date, document.getElementById("name").value); });
    document.getElementById("copy").addEventListener("click", function () {
      var btn = this, text = document.getElementById("invite").textContent;
      var done = function (ok) { btn.textContent = ok ? "Copied" : "Press and hold the message to copy it"; setTimeout(function () { btn.textContent = "Copy message"; }, 2200); };
      try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); } catch (err) { done(false); }
    });
    app.querySelectorAll("button[data-act]").forEach(function (btn) {
      btn.addEventListener("click", function () { setStatus(btn.getAttribute("data-id"), btn.getAttribute("data-act")); });
    });
  }

  function render() {
    var keepName = document.getElementById("name"), typed = keepName ? keepName.value : "", focused = keepName && document.activeElement === keepName;
    var c = route();
    if (c) {
      renderClass(c);
      var inp = document.getElementById("name");
      if (inp && typed) inp.value = typed;
      if (inp && focused) inp.focus();
    } else renderHome();
  }

  async function book(c, date, raw) {
    var name = String(raw || "").replace(/\s+/g, " ").trim().slice(0, 40);
    if (!name) { S.msg = "Type your name first."; S.msgKind = "err"; render(); return; }
    var existing = S.rows.find(function (r) { return r.class_id === c.id && r.session_date === date && r.name.toLowerCase() === name.toLowerCase(); });
    if (existing && existing.status === "in") { S.msg = existing.name + " is already booked."; S.msgKind = "info"; render(); return; }
    if (existing && existing.status === "wait") { S.msg = existing.name + " is already on the waitlist."; S.msgKind = "info"; render(); return; }
    S.busy = true; render();
    var res = existing
      ? await db.from("bookings").update({ status: "in" }).eq("id", existing.id).select().single()
      : await db.from("bookings").insert({ class_id: c.id, session_date: date, name: name, status: "in" }).select().single();
    S.busy = false;
    if (res.error) {
      S.msg = res.error.code === "23505" ? name + " is already on this class list." : "That didn't save. Check your connection and try again.";
      S.msgKind = "err";
    } else {
      var r = res.data;
      S.msg = r.status === "in" ? "You're in, " + firstName(r.name) + ". See you " + (function (w) { return /^(Tonight|Today|Tomorrow)$/.test(w) ? w.toLowerCase() : "on " + w; })(dayWord(nextSession(c), new Date())) + "." : "Class is full. " + firstName(r.name) + " is on the waitlist and moves up if someone opts out.";
      S.msgKind = "ok";
      var inp = document.getElementById("name"); if (inp) inp.value = "";
    }
    await load();
  }

  async function setStatus(id, status) {
    if (S.busy) return;
    var r = S.rows.find(function (x) { return x.id === id; });
    S.busy = true; render();
    var res = await db.from("bookings").update({ status: status }).eq("id", id).select().single();
    S.busy = false;
    if (res.error) { S.msg = "That didn't save. Check your connection and try again."; S.msgKind = "err"; }
    else if (status === "out") { S.msg = r ? firstName(r.name) + " opted out." : "Opted out."; S.msgKind = "info"; }
    else { S.msg = res.data.status === "in" ? firstName(res.data.name) + " is back in." : "Class is full, so " + firstName(res.data.name) + " is on the waitlist."; S.msgKind = res.data.status === "in" ? "ok" : "info"; }
    await load();
  }

  window.addEventListener("hashchange", function () { S.msg = ""; render(); window.scrollTo(0, 0); });
  render();
  load();
  setInterval(load, 20000);
  if (db) {
    try {
      db.channel("bookings-live").on("postgres_changes", { event: "*", schema: "public", table: "bookings" }, function () { load(); }).subscribe();
    } catch (e) {}
  }
})();
</script>
</body>
</html>
