<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitnation Kenvil · Book a Class</title>
<meta name="description" content="Book your spot in Fitnation Athletics classes in Kenvil, NJ. 14 spots per class.">
<meta name="theme-color" content="#07090a">
<link rel="icon" id="fav" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root {
  /* Fitnation brand world: black, neon green, silver. Header, week calendar, big class cards, class page with 14-spot board */
  --bg: #07090a; --surface: #111417; --raised: #181c20; --line: #262b30;
  --ink: #f2f4f1; --muted: #9aa29c; --green: #a5e84a; --green-ink: #0b1203; --warn: #f5b94a;
  --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
  --label: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
p { margin: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 64px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand .f { height: 34px; width: auto; }
.brand .wm { height: 40px; width: auto; }
.top .addr { color: var(--muted); font-size: 14px; font-weight: 500; text-align: right; }
h1, h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; margin: 0; line-height: .95; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: clamp(44px, 9vw, 88px); }
h2 { font-size: 28px; }
h3 { margin: 0; font-family: var(--label); font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.eyebrow { font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: var(--green); }
.silver { background: linear-gradient(180deg, #ffffff 0%, #c9cdd1 45%, #8b9096 55%, #e9ecee 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero { display: grid; gap: 12px; padding: 30px 0 26px; }
.hero h1 span { color: var(--green); display: block; text-shadow: 0 0 28px rgba(165, 232, 74, .35); }
.lede { max-width: 58ch; color: var(--muted); font-size: 18px; font-weight: 500; }

/* Week calendar */
.cal { display: grid; gap: 12px; margin-bottom: 26px; }
.cal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.days { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.day { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 4px 9px; display: grid; justify-items: center; gap: 2px; cursor: pointer; font: inherit; min-width: 0; }
.day .wd { font-family: var(--label); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.day .dn { font-family: var(--display); font-size: 30px; line-height: 1.05; }
.day .ct { font-size: 12px; color: var(--muted); white-space: nowrap; }
.day .dots { display: flex; gap: 3px; height: 6px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); opacity: .85; }
.day.today .wd { color: var(--green); }
.day[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); box-shadow: 0 0 22px rgba(165, 232, 74, .3); }
.day[aria-pressed="true"] .wd, .day[aria-pressed="true"] .ct { color: var(--green-ink); }
.day[aria-pressed="true"] .dots i { background: var(--green-ink); }
.day.all .dn { font-size: 22px; padding: 4px 0 2px; }
.day:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
@media (max-width: 640px) {
  .days { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* Class cards */
.list-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.ccard { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 12px; text-decoration: none; transition: border-color .15s, transform .15s, box-shadow .15s; overflow: hidden; }
.ccard::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--green); box-shadow: 0 0 14px var(--green); }
.ccard:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 0 0 1px rgba(165, 232, 74, .25); }
.ccard:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
.ccard .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ccard .time { font-family: var(--display); font-size: 40px; line-height: 1; color: var(--green); }
.ccard .when { font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.ccard .cname { font-family: var(--display); font-size: 28px; text-transform: uppercase; line-height: 1; }
.ccard .coach { font-weight: 600; }
.ccard .coach b { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; }
.meter { height: 8px; background: var(--raised); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 99px; box-shadow: 0 0 10px var(--green); transition: width .4s; }
.ccard .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ccard .cta { color: var(--green); font-family: var(--label); font-weight: 700; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; }
.ccard.past { opacity: .45; }
.ccard.past::before { background: var(--line); box-shadow: none; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-weight: 700; font-size: 13px; border: 1.5px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--green); } .pill.warn { color: var(--warn); } .pill.last { color: #ff6b5e; } .pill.idle { color: var(--muted); }
.pill.full { color: var(--green-ink); background: var(--ink); border-color: var(--ink); }
.pill.warn::before, .pill.last::before { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.empty-day { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 28px; color: var(--muted); font-weight: 500; }
.notice { margin-top: 18px; border-left: 4px solid var(--warn); background: var(--surface); padding: 12px 14px; border-radius: 6px; font-weight: 500; }

/* Class types */
.types { margin-top: 44px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.type { border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 8px; background: linear-gradient(180deg, var(--surface), var(--bg)); }
.type h2 { font-size: 24px; color: var(--green); }
.type p { color: var(--muted); }
.site-foot { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.site-foot b { color: var(--ink); font-family: var(--label); letter-spacing: .1em; text-transform: uppercase; }

/* Class page */
.back { display: inline-flex; gap: 6px; font-family: var(--label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; color: var(--muted); padding: 18px 0 6px; }
.back:hover { color: var(--green); }
.chero { display: grid; gap: 8px; padding: 6px 0 22px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.chero h1 { display: flex; flex-wrap: wrap; gap: 0 18px; align-items: baseline; }
.chero h1 .t { color: var(--green); text-shadow: 0 0 28px rgba(165, 232, 74, .35); }
.coachline { font-family: var(--display); font-size: clamp(28px, 5vw, 40px); text-transform: uppercase; line-height: 1; }
.cmeta { color: var(--muted); font-weight: 500; }
.countdown { font-weight: 600; font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 20px; }
.col { display: contents; }
.capacity { order: 1; } .book { order: 2; } .about { order: 3; } .share { order: 4; }
@media (min-width: 880px) { .grid { grid-template-columns: 1fr 1fr; align-items: start; } .col { display: grid; gap: 20px; min-width: 0; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.cap-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.big { font-family: var(--display); font-size: 68px; line-height: .9; font-variant-numeric: tabular-nums; }
.big .of { color: var(--muted); font-size: 34px; margin-left: 4px; }
.big-label { display: block; font-family: var(--label); font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
.sub { color: var(--muted); font-weight: 500; }
.spots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.spot { aspect-ratio: 1; border-radius: 10px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-family: var(--label); font-weight: 700; font-size: 14px; }
.spot.taken { background: var(--green); border: 1.5px solid var(--green); color: var(--green-ink); box-shadow: 0 0 12px rgba(165, 232, 74, .35); }
.legend { color: var(--muted); font-size: 14px; }
form { display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
label { font-weight: 600; }
input[type="text"], input[type="tel"], input[type="email"] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
input:focus-visible { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(165, 232, 74, .2); }
.two { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
.privacy { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: 14px; }
.privacy svg { flex: none; margin-top: 2px; }
button { font: inherit; cursor: pointer; border-radius: 10px; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.primary { background: var(--green); color: var(--green-ink); border: 0; padding: 14px 22px; font-family: var(--label); font-weight: 700; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 0 22px rgba(165, 232, 74, .3); }
.primary:hover:not(:disabled) { filter: brightness(1.08); }
.secondary { justify-self: start; background: var(--raised); color: var(--ink); border: 1px solid var(--line); padding: 11px 18px; font-weight: 700; }
.secondary:hover:not(:disabled) { border-color: var(--green); }
.linkish { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; justify-self: start; font-size: 14px; }
button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-weight: 600; min-height: 1.45em; }
.msg.ok { color: var(--green); } .msg.err { color: #ff6b5e; } .msg.info { color: var(--muted); }
.booked { border: 1.5px solid var(--green); background: rgba(165, 232, 74, .07); border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
.booked strong { font-family: var(--display); font-weight: 400; font-size: 26px; text-transform: uppercase; color: var(--green); }
.invite { margin: 0; padding: 14px; background: var(--bg); border-radius: 10px; white-space: pre-wrap; font-family: var(--body); font-size: 15px; user-select: all; -webkit-user-select: all; border: 1px solid var(--line); }
.cancel-other { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.cancel-other[hidden] { display: none; }
.cancel-other .row { display: flex; gap: 8px; flex-wrap: wrap; }
.cancel-other input { flex: 1 1 200px; }
@media (max-width: 420px) { .wrap { padding: 0 16px 48px; } .card { padding: 16px; } .brand .wm { height: 32px; } .brand .f { height: 26px; } .top .addr { font-size: 12px; } .big { font-size: 56px; } .spots { gap: 6px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Staff page */
.staff-gate { max-width: 440px; margin: 40px auto; }
.staff-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding: 24px 0 6px; }
.staff-head h1 { font-size: clamp(36px, 7vw, 64px); }
.staff-actions { display: flex; gap: 8px; }
.sday { margin-top: 26px; display: grid; gap: 12px; }
.sday > h2 { font-size: 26px; }
.sclass { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; }
.sclass-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.sclass-top b { font-family: var(--display); font-weight: 400; font-size: 22px; text-transform: uppercase; }
.sclass-top b.t { color: var(--green); }
.tablewrap { overflow-x: auto; }
.rtable { width: 100%; border-collapse: collapse; font-size: 15px; }
.rtable th { text-align: left; font-family: var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.rtable td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rtable a { color: var(--ink); }
.tag { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.tag.in { color: var(--green); } .tag.wait { color: var(--warn); } .tag.out { color: var(--muted); }
.staff-link { color: var(--muted); }
input[type="password"] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
</style>
</head>

    return { s: s, start: start, date: ymd(d), past: false };
  }
  function dayWord(start, now) {
    var diff = Math.round((startOfDay(start) - startOfDay(now)) / 86400000);
    if (diff === 0) return start.getHours() >= 17 ? "Tonight" : "Today";
    if (diff === 1) return "Tomorrow";
    return start.toLocaleDateString(undefined, { weekday: "long" });
  }
  function countdown(start, now) {
    var ms = start - now;
    if (ms <= 0) return "Class in progress";
    var m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d >= 1) return "Starts in " + d + "d " + (h % 24) + "h";
    return "Starts in " + (h ? h + "h " : "") + (m % 60) + "m";
  }
  function countFor(o) { return S.counts[o.s.id + "|" + o.date] || { booked: 0, waiting: 0 }; }
  function scarcity(n) {
    var left = Math.max(0, CAP - n);
    if (left === 0) return { label: "Full · waitlist open", kind: "full" };
    if (left === 1) return { label: "Last spot!", kind: "last" };
    if (left <= 4) return { label: "Only " + left + " spots left", kind: "warn" };
    return { label: left + " spots open", kind: "ok" };
  }

  // Cancel codes saved on this device only.
  function saved() { try { return JSON.parse(localStorage.getItem("fn_bookings") || "{}"); } catch (e) { return {}; } }
  function saveToken(key, token, first) { try { var m = saved(); m[key] = { t: token, n: first }; localStorage.setItem("fn_bookings", JSON.stringify(m)); } catch (e) {} }
  function dropToken(key) { try { var m = saved(); delete m[key]; localStorage.setItem("fn_bookings", JSON.stringify(m)); } catch (e) {} }

  async function load() {
    if (!db) { S.error = "offline"; S.loaded = true; render(); return; }
    var now = new Date(), from = ymd(now), to = new Date(now); to.setDate(to.getDate() + 8);
    var res = await db.rpc("spot_counts", { p_from: from, p_to: ymd(to) });
    if (res.error) {
      S.error = /function|schema cache|does not exist/i.test(res.error.message || "") ? "setup" : "offline";
    } else {
      S.error = "";
      var c = {};
      (res.data || []).forEach(function (r) { c[r.class_id + "|" + r.session_date] = { booked: r.booked, waiting: r.waiting }; });
      S.counts = c;
    }
    S.loaded = true;
    render();
  }

  function route() { var h = location.hash.replace(/^#\/?/, ""); return SESSIONS.find(function (s) { return s.id === h; }) || null; }
  function noticeHtml() {
    if (S.error === "setup") return '<p class="notice">Booking opens soon. The front desk is still setting up the class lists.</p>';
    if (S.error === "offline") return '<p class="notice">Can\'t reach the class lists right now. Check your connection and refresh.</p>';
    return "";
  }

  function cardHtml(o, now) {
    var t = TYPES[o.s.type], n = countFor(o).booked, sc = scarcity(n), live = S.loaded && !S.error;
    var pill = o.past ? '<span class="pill idle">Finished</span>' : live ? '<span class="pill ' + sc.kind + '">' + esc(sc.label) + "</span>" : '<span class="pill idle">' + (S.loaded ? "14 spots" : "Loading") + "</span>";
    var inner =
      '<div class="row1"><div><p class="time">' + esc(timeLabel(o.s)) + '</p><p class="when">' + esc(dayWord(o.start, now)) + " · " + esc(o.start.toLocaleDateString(undefined, { month: "short", day: "numeric" })) + "</p></div>" + pill + "</div>" +
      '<p class="cname">' + esc(t.name) + "</p>" +
      '<p class="coach">Coach <b class="silver">' + esc(o.s.coach) + "</b></p>" +
      '<div class="meter" aria-hidden="true"><i style="width:' + (live ? Math.round(n / CAP * 100) : 0) + '%"></i></div>' +
      '<div class="foot"><span>' + (live ? n + " of " + CAP + " spots taken" : "&nbsp;") + '</span><span class="cta">' + (o.past ? "" : "Book &rarr;") + "</span></div>";
    return o.past ? '<div class="ccard past">' + inner + "</div>" : '<a class="ccard" href="#' + o.s.id + '">' + inner + "</a>";
  }

  function renderHome() {
    var now = new Date(), w = week(now);
    if (S.day === null) {
      var first = w.find(function (d) { return d.list.some(function (o) { return !o.past; }); });
      S.day = first ? first.key : w[0].key;
    }
    var dayBtns = '<button type="button" class="day all" data-day="all" aria-pressed="' + (S.day === "all") + '"><span class="wd">This</span><span class="dn">WEEK</span><span class="ct">' + w.reduce(function (a, d) { return a + d.list.length; }, 0) + ' classes</span><span class="dots"></span></button>' +
      w.map(function (d, i) {
        var dots = d.list.map(function () { return "<i></i>"; }).join("");
        return '<button type="button" class="day' + (i === 0 ? " today" : "") + '" data-day="' + d.key + '" aria-pressed="' + (S.day === d.key) + '" aria-label="' + esc(d.date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })) + ", " + d.list.length + ' classes">' +
          '<span class="wd">' + (i === 0 ? "Today" : esc(d.date.toLocaleDateString(undefined, { weekday: "short" }))) + '</span><span class="dn">' + d.date.getDate() + '</span><span class="ct">' + (d.list.length ? d.list.length + (d.list.length === 1 ? " class" : " classes") : "No classes") + '</span><span class="dots">' + dots + "</span></button>";
      }).join("");

    var listTitle, items;
    if (S.day === "all") {
      listTitle = "This week";
      items = [];
      w.forEach(function (d) { d.list.forEach(function (o) { if (!o.past) items.push(o); }); });
    } else {
      var sel = w.find(function (d) { return d.key === S.day; }) || w[0];
      listTitle = sel.date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      items = sel.list;
    }
    var cards = items.length ? '<div class="cards">' + items.map(function (o) { return cardHtml(o, now); }).join("") + "</div>"
      : '<p class="empty-day">No classes this day. Pick another day above.</p>';

    app.innerHTML =
      '<section class="hero"><p class="eyebrow">Fitnation Athletics · Kenvil, NJ</p><h1>Book your<span>class</span></h1>' +
      '<p class="lede">Pick a day, tap a class and save your spot. Every class caps at 14, so book early.</p></section>' +
      '<section class="cal" aria-label="This week\'s calendar"><div class="cal-head"><h3>Class calendar</h3></div><div class="days">' + dayBtns + "</div></section>" +
      '<section aria-live="polite"><div class="list-head"><h2>' + esc(listTitle) + "</h2></div>" + cards + "</section>" + noticeHtml() +
      '<section class="types" aria-label="Our classes">' + ["pilates", "yoga", "sc"].map(function (k) { return '<div class="type"><h2>' + esc(TYPES[k].name) + "</h2><p>" + esc(TYPES[k].about) + "</p></div>"; }).join("") + "</section>";

    app.querySelectorAll(".day").forEach(function (b) {
      b.addEventListener("click", function () { S.day = b.getAttribute("data-day"); render(); });
    });
  }

  function renderClass(s) {
    var now = new Date(), o = occurrence(s.id, now), t = TYPES[s.type], word = dayWord(o.start, now);
    var c = countFor(o), n = c.booked, left = Math.max(0, CAP - n), sc = scarcity(n), live = S.loaded && !S.error;
    var key = s.id + "|" + o.date, mine = saved()[key];
    var spots = "";
    for (var i = 1; i <= CAP; i++) spots += '<li class="spot' + (live && i <= n ? " taken" : "") + '" aria-hidden="true">' + (live && i <= n ? "" : i) + "</li>";
    var dis = S.busy || !live ? " disabled" : "";
    var parts = [n + " of " + CAP + " spots taken"]; if (c.waiting) parts.push(c.waiting + " on the waitlist");
    var link = location.href.split("#")[0] + "#" + s.id;
    var invite = t.short + " with Coach " + s.coach + ", " + (/^(Tonight|Today|Tomorrow)$/.test(word) ? word.toLowerCase() : word) + " at " + timeLabel(s) + ". " +
      (live ? (left === 0 ? "Full, but the waitlist is open." : left <= 4 ? "Only " + left + " spots left." : n + "/14 spots taken.") : "") + "\nSave your spot: " + link;

    var bookBlock = mine
      ? '<div class="booked"><strong>You\'re booked</strong><p>' + esc(mine.n ? mine.n + ", y" : "Y") + 'our spot is saved for ' + esc(word.toLowerCase() === "tonight" || word.toLowerCase() === "today" || word.toLowerCase() === "tomorrow" ? word.toLowerCase() : word) + " at " + esc(timeLabel(s)) + '. Can\'t make it? Cancel so someone else gets it.</p><button type="button" class="secondary" id="cancel-mine"' + dis + '>Cancel my spot</button></div>'
      : '<form id="form" autocomplete="on">' +
          '<div class="field"><label for="name">Full name</label><input type="text" id="name" name="name" autocomplete="name" maxlength="40" required' + dis + '></div>' +
          '<div class="two"><div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="tel" autocomplete="tel" inputmode="tel" maxlength="20" required' + dis + '></div>' +
          '<div class="field"><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" maxlength="120" required' + dis + '></div></div>' +
          '<p class="privacy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Only Fitnation staff can see your name, phone and email. Everyone else just sees how many spots are taken.</p>' +
          '<button type="submit" class="primary"' + dis + ">" + (live && left === 0 ? "Join the waitlist" : "Reserve my spot") + "</button></form>";

    app.innerHTML =
      '<a class="back" href="#">&larr; All classes</a>' +
      '<section class="chero"><p class="eyebrow">' + esc(word) + " · " + esc(o.start.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })) + "</p>" +
      '<h1><span>' + esc(t.short) + '</span><span class="t">' + esc(timeLabel(s)) + "</span></h1>" +
      '<p class="coachline">Coach <span class="silver">' + esc(s.coach) + "</span></p>" +
      '<p class="cmeta">' + esc(t.name) + " · 659 US-46, Kenvil</p>" +
      '<p class="countdown">' + countdown(o.start, now) + "</p></section>" +
      '<div class="grid"><div class="col">' +
        '<section class="card capacity" aria-label="Spots taken"><div class="cap-top"><div class="big"><span>' + (live ? n : "–") + '</span><span class="of">/14</span><span class="big-label">Spots taken</span></div>' +
          '<span class="pill ' + (live ? sc.kind : "idle") + '">' + esc(live ? sc.label : (S.loaded ? "Not open yet" : "Loading")) + "</span></div>" +
          '<p class="sub">' + (live ? parts.join(" · ") : "&nbsp;") + "</p>" +
          '<ul class="spots">' + spots + '</ul><p class="legend">Green spots are taken. Names stay private.</p></section>' +
        '<section class="card about"><h2>About this class</h2><p class="sub">' + esc(t.about) + "</p></section>" +
      '</div><div class="col">' +
        '<section class="card book"><h2>' + (mine ? "Your spot" : "Save your spot") + "</h2>" + noticeHtml() + bookBlock +
          '<p class="msg ' + S.msgKind + '" role="status" aria-live="polite">' + esc(S.msg) + "</p>" +
          (mine ? "" : '<button type="button" class="linkish" id="show-cancel">Already booked and can\'t make it?</button>' +
          '<div class="cancel-other"' + (S.showCancelOther ? "" : " hidden") + '><label for="contact">Enter the email or phone you booked with</label><div class="row"><input type="text" id="contact" autocomplete="email"' + dis + '><button type="button" class="secondary" id="cancel-contact"' + dis + ">Cancel my spot</button></div></div>") +
        "</section>" +
        '<section class="card share"><h2>Share this class</h2><p class="sub">Send it to the group chat.</p><pre class="invite" id="invite">' + esc(invite) + '</pre><button type="button" class="secondary" id="copy">Copy message</button></section>' +
      "</div></div>";

    var form = document.getElementById("form");
    if (form) form.addEventListener("submit", function (e) { e.preventDefault(); book(o); });
    var cm = document.getElementById("cancel-mine");
    if (cm) cm.addEventListener("click", function () { cancelMine(o); });
    var sc2 = document.getElementById("show-cancel");
    if (sc2) sc2.addEventListener("click", function () { S.showCancelOther = !S.showCancelOther; render(); });
    var cc = document.getElementById("cancel-contact");
    if (cc) cc.addEventListener("click", function () { cancelByContact(o, document.getElementById("contact").value); });
    document.getElementById("copy").addEventListener("click", function () {
      var btn = this, text = document.getElementById("invite").textContent;
      var done = function (ok) { btn.textContent = ok ? "Copied" : "Press and hold the message to copy it"; setTimeout(function () { btn.textContent = "Copy message"; }, 2200); };
      try { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); }); } catch (err) { done(false); }
    });
  }

  var ST = { code: null, rows: null, err: "", busy: false };
  try { ST.code = sessionStorage.getItem("fn_staff") || null; } catch (e) {}
  function fmtPhone(p) { p = String(p || ""); return p.length === 10 ? "(" + p.slice(0, 3) + ") " + p.slice(3, 6) + "-" + p.slice(6) : p; }
  async function loadStaff() {
    if (!ST.code || !db) return;
    ST.busy = true;
    if (location.hash === "#staff" && !ST.rows) render();
    var now = new Date(), to = new Date(now); to.setDate(to.getDate() + 8);
    var res = await db.rpc("staff_roster", { p_code: ST.code, p_from: ymd(now), p_to: ymd(to) });
    ST.busy = false;
    if (res.error) {
      var bad = /passcode/i.test(res.error.message || "");
      ST.err = bad ? "That passcode didn't work." : "Couldn't load the list. Check your connection.";
      ST.rows = null;
      if (bad) { ST.code = null; try { sessionStorage.removeItem("fn_staff"); } catch (e) {} }
    } else { ST.err = ""; ST.rows = res.data || []; }
    if (location.hash === "#staff") render();
  }
  function renderStaff() {
    if (!ST.rows) {
      var d = ST.busy ? " disabled" : "";
      app.innerHTML = '<section class="card staff-gate"><p class="eyebrow">Staff only</p><h2>Class sign-ups</h2>' +
        '<form id="sform"><div class="field"><label for="scode">Staff passcode</label><input type="password" id="scode" autocomplete="current-password"' + d + '></div>' +
        '<button type="submit" class="primary"' + d + ">" + (ST.busy ? "Checking…" : "View sign-ups") + "</button>" +
        '<p class="msg err" role="status">' + esc(ST.err) + '</p></form><a class="back" href="#">&larr; Back to classes</a></section>';
      document.getElementById("sform").addEventListener("submit", function (e) {
        e.preventDefault();
        var v = document.getElementById("scode").value.trim();
        if (!v) return;
        ST.code = v; ST.err = "";
        try { sessionStorage.setItem("fn_staff", v); } catch (x) {}
        loadStaff();
      });
      return;
    }
    var now = new Date(), w = week(now), byKey = {}, order = { "in": 0, wait: 1, out: 2 };
    ST.rows.forEach(function (r) { var k = r.class_id + "|" + r.session_date; (byKey[k] = byKey[k] || []).push(r); });
    var total = ST.rows.filter(function (r) { return r.status === "in"; }).length;
    var html = '<div class="staff-head"><div><p class="eyebrow">Staff only</p><h1>Sign-ups</h1><p class="sub">Next 7 days · ' + total + ' booked</p></div>' +
      '<div class="staff-actions"><button type="button" class="secondary" id="srefresh">Refresh</button><button type="button" class="secondary" id="sout">Lock</button></div></div>';
    w.forEach(function (d) {
      if (!d.list.length) return;
      html += '<section class="sday"><h2>' + esc(d.date.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })) + "</h2>";
      d.list.forEach(function (o) {
        var rows = (byKey[o.s.id + "|" + o.date] || []).slice().sort(function (a, b) { return order[a.status] - order[b.status] || new Date(a.booked_at) - new Date(b.booked_at); });
        var nIn = rows.filter(function (r) { return r.status === "in"; }).length, nW = rows.filter(function (r) { return r.status === "wait"; }).length;
        html += '<div class="sclass"><div class="sclass-top"><span><b class="t">' + esc(timeLabel(o.s)) + "</b> <b>" + esc(TYPES[o.s.type].short) + "</b> · Coach " + esc(o.s.coach) + "</span>" +
          '<span class="pill ' + (nIn >= CAP ? "full" : "ok") + '">' + nIn + "/" + CAP + (nW ? " · " + nW + " waitlist" : "") + "</span></div>";
        if (!rows.length) html += '<p class="sub">No sign-ups yet.</p>';
        else html += '<div class="tablewrap"><table class="rtable"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Status</th></tr></thead><tbody>' +
          rows.map(function (r) {
            var lab = r.status === "in" ? "Booked" : r.status === "wait" ? "Waitlist" : "Cancelled";
            return "<tr><td>" + esc(r.name) + '</td><td><a href="tel:' + esc(r.phone) + '">' + esc(fmtPhone(r.phone)) + '</a></td><td><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></td><td><span class="tag ' + esc(r.status) + '">' + lab + "</span></td></tr>";
          }).join("") + "</tbody></table></div>";
        html += "</div>";
      });
      html += "</section>";
    });
    app.innerHTML = html;
    document.getElementById("srefresh").addEventListener("click", loadStaff);
    document.getElementById("sout").addEventListener("click", function () { ST.code = null; ST.rows = null; try { sessionStorage.removeItem("fn_staff"); } catch (e) {} render(); });
  }

  function render() {
    var ids = ["name", "phone", "email", "contact", "scode"], keep = {}, focused = document.activeElement && document.activeElement.id;
    ids.forEach(function (id) { var el = document.getElementById(id); if (el) keep[id] = el.value; });
    if (location.hash === "#staff") renderStaff();
    else { var s = route(); if (s) renderClass(s); else renderHome(); }
    ids.forEach(function (id) { var el = document.getElementById(id); if (el && keep[id]) el.value = keep[id]; });
    if (focused && ids.indexOf(focused) !== -1) { var f = document.getElementById(focused); if (f) f.focus(); }
  }

  async function book(o) {
    var name = document.getElementById("name").value.replace(/\s+/g, " ").trim();
    var phone = document.getElementById("phone").value.trim();
    var email = document.getElementById("email").value.trim();
    if (!name) { S.msg = "Type your name."; S.msgKind = "err"; render(); return; }
    if (phone.replace(/\D/g, "").length < 10) { S.msg = "Enter a phone number with area code."; S.msgKind = "err"; render(); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { S.msg = "Enter a valid email, like name@example.com."; S.msgKind = "err"; render(); return; }
    S.busy = true; S.msg = ""; render();
    var res = await db.rpc("book_spot", { p_class: o.s.id, p_date: o.date, p_name: name, p_phone: phone, p_email: email });
    S.busy = false;
    var r = res.data && res.data[0];
    if (res.error || !r) {
      S.msg = "That didn't save. Check your connection and try again."; S.msgKind = "err";
    } else if (r.status === "already") {
      S.msg = "That email or phone is already booked for this class."; S.msgKind = "info";
    } else {
      saveToken(o.s.id + "|" + o.date, r.cancel_token, firstName(name));
      S.msg = r.status === "in" ? "You're in, " + firstName(name) + ". See you there." : "Class is full. You're on the waitlist and move up if someone cancels.";
      S.msgKind = "ok";
      ["name", "phone", "email"].forEach(function (id) { var el = document.getElementById(id); if (el) el.value = ""; });
    }
    await load();
  }

  async function cancelMine(o) {
    var key = o.s.id + "|" + o.date, mine = saved()[key];
    if (!mine) return;
    S.busy = true; render();
    var res = await db.rpc("cancel_spot", { p_token: mine.t });
    S.busy = false;
    if (res.error) { S.msg = "That didn't go through. Try again."; S.msgKind = "err"; }
    else { dropToken(key); S.msg = "Your spot is cancelled. Thanks for letting us know."; S.msgKind = "info"; }
    await load();
  }

  async function cancelByContact(o, contact) {
    contact = String(contact || "").trim();
    if (contact.length < 5) { S.msg = "Enter the email or phone you booked with."; S.msgKind = "err"; render(); return; }
    S.busy = true; render();
    var res = await db.rpc("cancel_by_contact", { p_class: o.s.id, p_date: o.date, p_contact: contact });
    S.busy = false;
    if (res.error) { S.msg = "That didn't go through. Try again."; S.msgKind = "err"; }
    else if (!res.data) { S.msg = "We couldn't find a booking with that email or phone for this class."; S.msgKind = "err"; }
    else { S.msg = "Your spot is cancelled. Thanks for letting us know."; S.msgKind = "info"; S.showCancelOther = false; var el = document.getElementById("contact"); if (el) el.value = ""; }
    await load();
  }

  window.addEventListener("hashchange", function () { S.msg = ""; S.showCancelOther = false; if (location.hash === "#staff" && ST.code && !ST.rows) loadStaff(); render(); window.scrollTo(0, 0); });
  if (location.hash === "#staff" && ST.code) loadStaff();
  render();
  load();
  setInterval(load, 20000);
})();
</script>
</body>
</html>
